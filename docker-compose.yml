version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dataset_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataset_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/Dataset_Management_tool
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dataset_management
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/app/storage

  frontend:
    build:
      context: ./frontend/Dataset_Management_tool_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  backend_storage:
