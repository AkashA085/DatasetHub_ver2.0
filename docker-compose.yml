services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: dataset_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-mlflow.sh:/docker-entrypoint-initdb.d/init-mlflow.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataset_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/Dataset_Management_tool

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "120"]
    restart: unless-stopped
    init: true

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/dataset_management
      DATASET_STORAGE_ROOT: /app/app/storage

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8001:8000"

    volumes:
      - ./backend/Dataset_Management_tool:/app 
      - backend_storage:/app/app/storage
      - ./:/host_repo:ro

    ipc: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build:
      context: ./frontend/Dataset_Management_tool_frontend
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5174:5173"
    volumes:
      - ./frontend/Dataset_Management_tool_frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  backend_storage: